<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aviks Empregos</title>
<meta name="theme-color" content="#2F3337">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Empregos">
<style>
:root{--bg:#F2F3F5;--card:#FFFFFF;--txt:#202326;--sub:#646A72;--linha:#E1E3E7;--pri:#3F4349;--pri-txt:#FFFFFF;--pri-s:#E7E9EC;--topo:#2F3337;
--ok:#2F7D57;--ok-s:#E4F1EA;--alerta:#9A6512;--alerta-s:#F7EEDD;--erro:#B53A3A;--erro-s:#F8E6E6;--neutro-s:#ECEEF0}
@media (prefers-color-scheme:dark){:root{--bg:#141618;--card:#1C1F22;--txt:#E9EBEE;--sub:#9AA0A8;--linha:#2B2F34;--pri:#D3D7DC;--pri-txt:#1C1F22;--pri-s:#2B2F34;--topo:#1C1F22;
--ok:#6CC79A;--ok-s:#17281F;--alerta:#E0B062;--alerta-s:#2B2416;--erro:#EE8686;--erro-s:#301B1B;--neutro-s:#24282C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--topo);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;margin-bottom:14px}
header .in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1200px;margin:auto}
header .logo{height:38px;width:auto;display:block}header .sub{color:#C9CDD3}header .pill{color:#C9CDD3}
header button{background:transparent;color:#fff;border-color:#5A5F66}header button.pri{background:#fff;color:#2F3337;border-color:#fff}
h1{position:absolute;left:-9999px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--sub);font-size:13px}
main{max-width:1200px;margin:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{color:var(--sub);font-size:13px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.duas{grid-template-columns:1fr}}
button,.btn{font:inherit;border:1px solid var(--linha);background:var(--card);color:var(--txt);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-txt)}button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{padding:4px 10px;border-radius:99px;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-txt)}
input,textarea,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:7px 10px;width:100%}
.tabela{overflow:auto;max-height:640px}main>*,.duas>*{min-width:0}thead th{position:sticky;top:0;background:var(--card)}table{width:100%;min-width:760px;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--linha)}
td{padding:8px;border-bottom:1px solid var(--linha);vertical-align:top}tr.l{cursor:pointer}tr.l:hover td{background:var(--neutro-s)}
.st{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;white-space:nowrap;background:var(--neutro-s)}
.st.candidatada,.st.em_processo{background:var(--pri-s);color:var(--txt)}.st.entrevista,.st.oferta{background:var(--ok-s);color:var(--ok)}
.st.teste,.st.precisa_de_voce,.st.aprovada{background:var(--alerta-s);color:var(--alerta)}.st.falhou,.st.reprovada{background:var(--erro-s);color:var(--erro)}
.nota{font-variant-numeric:tabular-nums;font-weight:600}.nota.a{color:var(--ok)}.nota.m{color:var(--alerta)}.nota.b{color:var(--sub)}
.motivo{color:var(--sub);font-size:13px;max-width:420px}
.pend{border-left:3px solid var(--alerta);padding:10px 12px;background:var(--alerta-s);border-radius:8px;margin-bottom:10px}
.pend p{margin:4px 0}.pend .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ag{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha)}.ag:last-child{border:0}.ag .q{min-width:96px;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.funil{display:grid;gap:6px}.fl{display:grid;grid-template-columns:minmax(0,150px) 1fr 44px;gap:8px;align-items:center;font-size:13px}
.barra{height:12px;border-radius:4px;background:var(--pri)}.fundo{background:var(--neutro-s);border-radius:4px}
.log{font-size:13px;max-height:320px;overflow:auto}.log div{padding:4px 0;border-bottom:1px solid var(--linha)}.log .t{color:var(--sub);font-variant-numeric:tabular-nums}
.log .erro{color:var(--erro)}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:calc(100% - 32px);background:var(--card);color:var(--txt)}dialog::backdrop{background:#0008}
dialog .in{padding:18px;max-height:85vh;overflow:auto}pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.vazio{color:var(--sub);font-size:14px;padding:8px 0}a{color:var(--pri)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--sub)}.dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}.dot.on{background:#6CC79A}.dot.pausa{background:var(--alerta)}
</style>
</head>
<body>
<header><div class="in">
  <div><h1>Aviks Empregos</h1><img class="logo" src="/marca/logo-horizontal-claro.svg" alt="Aviks Empregos" width="190" height="38">
    <div class="sub" id="estado" style="margin-top:6px">carregando…</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="bPausar">Pausar</button>
    <button class="pri" id="bRodar">Rodar agora</button>
    <button id="bSair" title="Sair">Sair</button>
  </div>
</div></header>
<main>
  <section class="kpis" id="kpis"></section>

  <section class="card" id="cPend" hidden>
    <h2>Precisa de você</h2>
    <div id="pendencias"></div>
  </section>

  <section class="duas">
    <div class="card"><h2>Agenda: entrevistas, testes e prazos</h2><div id="agenda"></div></div>
    <div class="card"><h2>Funil</h2><div class="funil" id="funil"></div></div>
  </section>

  <section class="card">
    <h2>Candidaturas</h2>
    <div class="chips" id="filtros"></div>
    <input id="busca" placeholder="Buscar empresa ou cargo" style="margin-bottom:10px">
    <div class="tabela"><table>
      <thead><tr><th>Vaga</th><th>Nota</th><th>Status</th><th>Etapa / motivo</th><th>Fonte</th><th>Atualizada</th></tr></thead>
      <tbody id="vagas"></tbody>
    </table></div>
  </section>

  <section class="duas">
    <div class="card"><h2>Candidaturas por dia (30 dias)</h2><div id="grafico"></div></div>
    <div class="card"><h2>Atividade do agente</h2><div class="log" id="log"></div></div>
  </section>
</main>

<dialog id="det"><div class="in" id="detIn"></div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filtro = 'ativas', rotulos = {}, resumo = {};

async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { ...opcoes, credentials: 'same-origin', headers: { 'content-type': 'application/json', ...(opcoes.headers || {}) } });
  if (r.status === 401) { location.href = '/entrar'; throw new Error('Sessão expirada'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || r.status);
  return j;
}

const GRUPOS = {
  ativas: ['candidatada','em_processo','teste','entrevista','oferta','precisa_de_voce','aprovada'],
  entrevistas: ['entrevista','oferta','teste'],
  enviadas: ['candidatada','em_processo'],
  descartadas: ['descartada'],
  problemas: ['falhou','precisa_de_voce'],
  encerradas: ['reprovada','encerrada'],
  todas: [],
};
const NOMES_FILTRO = { ativas:'Em andamento', entrevistas:'Entrevistas e testes', enviadas:'Enviadas', problemas:'Com problema', descartadas:'Descartadas', encerradas:'Encerradas', todas:'Todas' };

function quando(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T'));
  return isNaN(d) ? s : d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
const classeNota = (n) => n == null ? '' : n >= 80 ? 'a' : n >= 65 ? 'm' : 'b';

async function carregarResumo() {
  resumo = await api('/api/resumo');
  rotulos = resumo.rotulos;
  const s = resumo.porStatus, soma = (...k) => k.reduce((t, x) => t + (s[x] || 0), 0);
  const total = Object.values(s).reduce((a, b) => a + b, 0);
  const enviadas = soma('candidatada','em_processo','teste','entrevista','oferta','reprovada');
  const k = [
    ['Vagas analisadas', total, `${resumo.hoje.encontradas} novas hoje`],
    ['Candidaturas enviadas', enviadas, `${resumo.hoje.candidatadas}/${resumo.limite_dia} hoje`],
    ['Em processo', soma('em_processo','teste'), 'testes e análises'],
    ['Entrevistas', soma('entrevista','oferta'), `${s.oferta || 0} proposta(s)`],
    ['Descartadas', s.descartada || 0, `nota mínima ${resumo.nota_minima}`],
    ['Precisa de você', resumo.pendencias, 'perguntas abertas'],
  ];
  $('#kpis').innerHTML = k.map(([r, v, d]) => `<div class="card kpi"><span>${r}</span><b>${v}</b><span>${esc(d)}</span></div>`).join('');

  const pausado = resumo.pausado, rodando = resumo.rodando;
  $('#estado').innerHTML = `<span class="pill"><i class="dot ${rodando ? 'on' : pausado ? 'pausa' : ''}"></i>${rodando ? 'Trabalhando agora' : pausado ? 'Pausado' : 'Aguardando próximo horário'}</span>
    · ${resumo.ultimoCiclo ? `último ciclo ${quando(resumo.ultimoCiclo.quando)}: ${esc(resumo.ultimoCiclo.resumo)}` : 'ainda não rodou'}`;
  $('#bPausar').textContent = pausado ? 'Retomar' : 'Pausar';
  $('#bRodar').disabled = rodando || pausado;

  $('#agenda').innerHTML = resumo.agenda.length ? resumo.agenda.map((a) => `<div class="ag"><div class="q">${a.data_evento ? quando(a.data_evento) : 'sem data'}</div>
    <div><span class="st ${a.tipo === 'entrevista' ? 'entrevista' : 'teste'}">${esc(a.tipo)}</span> <b>${esc(a.empresa || '')}</b> ${esc(a.titulo || '')}
    <div class="sub">${esc(a.resumo)} ${a.link ? `· <a href="${esc(a.link)}" target="_blank" rel="noopener">abrir link</a>` : ''}</div></div></div>`).join('')
    : '<div class="vazio">Nada marcado ainda. Quando chegar convite por e-mail, aparece aqui e no seu celular.</div>';

  const etapas = [['Analisadas', total], ['Aprovadas (nota ≥ ' + resumo.nota_minima + ')', total - (s.descartada || 0) - (s.nova || 0)], ['Enviadas', enviadas],
    ['Retorno da empresa', soma('em_processo','teste','entrevista','oferta','reprovada')], ['Entrevista', soma('entrevista','oferta')], ['Proposta', s.oferta || 0]];
  const max = Math.max(1, total);
  $('#funil').innerHTML = etapas.map(([r, v]) => `<div class="fl"><span>${r}</span><div class="fundo"><div class="barra" style="width:${Math.max(v ? 2 : 0, v / max * 100)}%"></div></div><b>${v}</b></div>`).join('');

  grafico(resumo.porDia);
}

function grafico(dados) {
  const dias = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); dias.push(d.toISOString().slice(0, 10)); }
  const mapa = Object.fromEntries(dados.map((d) => [d.dia, d.n]));
  const vals = dias.map((d) => mapa[d] || 0), max = Math.max(1, ...vals);
  const L = 600, A = 150, bw = L / 30;
  $('#grafico').innerHTML = `<svg viewBox="0 0 ${L} ${A + 18}" width="100%" role="img" aria-label="Candidaturas por dia">
    ${vals.map((v, i) => `<rect x="${i * bw + 2}" y="${A - v / max * A}" width="${bw - 4}" height="${v / max * A}" rx="2" fill="var(--pri)"><title>${dias[i].slice(8)}/${dias[i].slice(5,7)}: ${v}</title></rect>`).join('')}
    <line x1="0" x2="${L}" y1="${A}" y2="${A}" stroke="var(--linha)"/>
    <text x="0" y="${A + 14}" font-size="11" fill="var(--sub)">${dias[0].slice(8)}/${dias[0].slice(5,7)}</text>
    <text x="${L}" y="${A + 14}" font-size="11" fill="var(--sub)" text-anchor="end">hoje</text>
    <text x="0" y="11" font-size="11" fill="var(--sub)">máx ${max}</text></svg>`;
}

async function carregarPendencias() {
  const ps = await api('/api/pendencias');
  $('#cPend').hidden = !ps.length;
  $('#pendencias').innerHTML = ps.map((p) => `<div class="pend" data-id="${p.id}">
    <b>${esc(p.empresa || 'E-mail de recrutador')}</b> ${p.titulo ? '— ' + esc(p.titulo) : ''} <span class="sub">${quando(p.criada_em)}</span>
    <p>${esc(p.pergunta)}</p>
    ${p.contexto ? `<details><summary class="sub">detalhes</summary><pre>${esc(p.contexto)}</pre></details>` : ''}
    <textarea rows="2" placeholder="Sua resposta (o agente guarda e reaproveita nas próximas)"></textarea>
    <div class="acoes">
      ${p.email_id ? '<label class="sub"><input type="checkbox" class="env" checked style="width:auto"> responder o e-mail com este texto</label>' : ''}
      <button class="pri" data-acao="responder">${p.vaga_id && !p.email_id ? 'Responder e tentar de novo' : 'Responder'}</button>
      <button data-acao="ignorar">${p.vaga_id && !p.email_id ? 'Desistir da vaga' : 'Ignorar'}</button>
      ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">abrir vaga</a>` : ''}
    </div></div>`).join('');
}

$('#pendencias').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const box = b.closest('.pend');
  b.disabled = true;
  try {
    await api(`/api/pendencias/${box.dataset.id}`, { method: 'POST', body: JSON.stringify({
      acao: b.dataset.acao, resposta: box.querySelector('textarea').value, enviar_email: !!box.querySelector('.env')?.checked }) });
    atualizar();
  } catch (err) { alert(err.message); b.disabled = false; }
});

function desenharFiltros() {
  $('#filtros').innerHTML = Object.keys(GRUPOS).map((g) => `<button class="chip ${g === filtro ? 'on' : ''}" data-g="${g}">${NOMES_FILTRO[g]}</button>`).join('');
}
$('#filtros').addEventListener('click', (e) => { const g = e.target.dataset.g; if (g) { filtro = g; desenharFiltros(); carregarVagas(); } });
let tBusca; $('#busca').addEventListener('input', () => { clearTimeout(tBusca); tBusca = setTimeout(carregarVagas, 250); });

async function carregarVagas() {
  const q = new URLSearchParams();
  if (GRUPOS[filtro].length) q.set('status', GRUPOS[filtro].join(','));
  if ($('#busca').value) q.set('q', $('#busca').value);
  const vs = await api('/api/vagas?' + q);
  $('#vagas').innerHTML = vs.length ? vs.map((v) => `<tr class="l" data-id="${v.id}">
    <td><b>${esc(v.titulo)}</b><div class="sub">${esc(v.empresa)}${v.local ? ' · ' + esc(v.local) : ''}</div></td>
    <td class="nota ${classeNota(v.nota)}">${v.nota ?? '—'}</td>
    <td><span class="st ${v.status}">${esc(rotulos[v.status] || v.status)}</span></td>
    <td class="motivo">${esc(v.status === 'descartada' ? v.motivo : (v.etapa || v.motivo || ''))}</td>
    <td class="sub">${esc(v.fonte)}</td><td class="sub">${quando(v.atualizada_em)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="vazio">Nenhuma vaga neste filtro.</td></tr>';
}

$('#vagas').addEventListener('click', async (e) => {
  const tr = e.target.closest('tr.l'); if (!tr) return;
  const v = await api('/api/vagas/' + tr.dataset.id);
  const opcoes = Object.entries(rotulos).map(([k, r]) => `<option value="${k}" ${k === v.status ? 'selected' : ''}>${r}</option>`).join('');
  $('#detIn').innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="margin:0">${esc(v.titulo)}</h2>
    <div class="sub">${esc(v.empresa)} · ${esc(v.local)} · ${esc(v.fonte)} · <a href="${esc(v.url)}" target="_blank" rel="noopener">ver vaga</a></div></div>
    <button onclick="det.close()" aria-label="Fechar">✕</button></div>
    <p><span class="nota ${classeNota(v.nota)}">Nota ${v.nota ?? '—'}</span> · ${esc(v.motivo || '')}</p>
    ${v.pontos_fortes ? `<p class="sub"><b>A favor:</b> ${esc(v.pontos_fortes)}</p>` : ''}${v.lacunas ? `<p class="sub"><b>Lacunas:</b> ${esc(v.lacunas)}</p>` : ''}
    <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap"><select id="novoSt" style="width:auto">${opcoes}</select>
      <input id="novaEt" value="${esc(v.etapa || '')}" placeholder="Etapa (ex.: entrevista técnica 28/11)" style="flex:1;min-width:200px">
      <button class="pri" id="salvarSt">Salvar</button></div>
    ${v.carta ? `<h2>Texto de apresentação enviado</h2><pre>${esc(v.carta)}</pre>` : ''}
    ${v.emails.length ? `<h2>E-mails</h2>${v.emails.map((m) => `<div class="ag"><div class="q">${quando(m.recebido_em)}</div><div><span class="st">${esc(m.tipo)}</span> ${esc(m.assunto)}<div class="sub">${esc(m.resumo)}${m.respondido ? ' · respondido automaticamente' : ''}</div></div></div>`).join('')}` : ''}
    <h2 style="margin-top:12px">Histórico</h2><div class="log">${v.eventos.map((ev) => `<div><span class="t">${quando(ev.quando)}</span> ${esc(ev.tipo)}: ${esc(ev.texto)}</div>`).join('')}</div>
    <details style="margin-top:10px"><summary class="sub">descrição da vaga</summary><pre>${esc(v.descricao)}</pre></details>`;
  $('#salvarSt').onclick = async () => { await api('/api/vagas/' + v.id, { method: 'PATCH', body: JSON.stringify({ status: $('#novoSt').value, etapa: $('#novaEt').value }) }); det.close(); atualizar(); };
  det.showModal();
});

async function carregarLog() {
  const ev = await api('/api/eventos?limite=80');
  $('#log').innerHTML = ev.map((e) => `<div class="${e.tipo === 'erro' ? 'erro' : ''}"><span class="t">${quando(e.quando)}</span> ${esc(e.tipo)}${e.empresa ? ' · ' + esc(e.empresa) : ''}: ${esc(e.texto)}</div>`).join('') || '<div class="vazio">Sem atividade ainda.</div>';
}

$('#bRodar').onclick = async () => { await api('/api/rodar', { method: 'POST' }); setTimeout(atualizar, 800); };
$('#bPausar').onclick = async () => { await api('/api/pausar', { method: 'POST', body: JSON.stringify({ pausado: !resumo.pausado }) }); atualizar(); };

async function atualizar() {
  try { await carregarResumo(); await Promise.all([carregarPendencias(), carregarVagas(), carregarLog()]); }
  catch (e) { $('#estado').textContent = 'Erro: ' + e.message; }
}
$('#bSair').onclick = async () => { await fetch('/sair', { method: 'POST' }); location.href = '/entrar'; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
desenharFiltros();
atualizar();
setInterval(atualizar, 30000);
</script>
</body>
</html>
