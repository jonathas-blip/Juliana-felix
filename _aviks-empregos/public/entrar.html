<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Aviks Empregos</title>
<meta name="theme-color" content="#2F3337">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Empregos">
<style>
:root{--fundo:#2F3337;--fundo2:#1F2225;--card:#FFFFFF;--txt:#202326;--sub:#646A72;--linha:#D9DCE0;--pri:#3F4349;--erro:#B53A3A}
@media (prefers-color-scheme:dark){:root{--card:#1C1F22;--txt:#E9EBEE;--sub:#9AA0A8;--linha:#33383E;--pri:#D3D7DC;--erro:#EE8686}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% 0%,var(--fundo) 0%,var(--fundo2) 100%);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt)}
.caixa{width:100%;max-width:380px}
.logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 28px}
form{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 20px 50px #0006}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 18px;color:var(--sub);font-size:14px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input{width:100%;font:inherit;color:var(--txt);background:transparent;border:1px solid var(--linha);border-radius:10px;padding:11px 12px}
input:focus{outline:2px solid var(--pri);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:20px;font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px;background:var(--pri);color:var(--card);cursor:pointer}
button:disabled{opacity:.6}
.erro{color:var(--erro);font-size:14px;min-height:20px;margin-top:12px}
.rodape{text-align:center;color:#9AA0A8;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main class="caixa">
  <img class="logo" src="/marca/logo-horizontal-claro.svg" alt="Aviks Empregos">
  <form id="f" autocomplete="on">
    <h1>Entrar</h1>
    <p>Acompanhe suas candidaturas.</p>
    <label for="u">Usuário</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="s">Senha</label>
    <input id="s" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Entrar</button>
    <div class="erro" id="e" role="alert"></div>
  </form>
  <div class="rodape">Aviks Empregos</div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ usuario: document.getElementById('u').value, senha: document.getElementById('s').value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.replace('/'); return; }
    e.textContent = j.erro || 'Não foi possível entrar';
  } catch { e.textContent = 'Sem conexão com o servidor'; }
  b.disabled = false;
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
