# Aviks Empregos na VPS do Aviks — contêiner separado, na rede aviks_sites (só o Caddy e os sites).
# Ele NÃO enxerga o banco nem a API do Aviks.
# Uso (na VPS, em /opt/aviks-empregos):  docker compose up -d --build
# O Caddy do Aviks encaminha empregos.aviks.com.br → aviks-empregos:3900 (ver deploy/Caddyfile.bloco).
services:
  aviks-empregos:
    build: .
    container_name: aviks-empregos
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - PORT=3900
      - URL_PAINEL=https://empregos.aviks.com.br
    volumes:
      - ./config:/app/config:ro
      - ./dados:/data
    shm_size: "1gb"          # o Chromium precisa de memória compartilhada
    mem_limit: 2g
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${REDE_CADDY:-aviks_sites}
